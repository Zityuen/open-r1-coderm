#Model arguments
model_name_or_path: KAKA22/CodeRM-8B
model_revision: main
torch_dtype: bfloat16
attn_implementation: flash_attention_2

# Data training arguments
dataset_name: zb1439/taco3_aug_dedup
dataset_prompt_column: problem
system_prompt: "You are a helpful AI Assistant that provides well-reasoned and detailed responses. You first think about the reasoning process as an internal monologue and then provide the user with the answer. Respond in the following format: <redacted_thinking>\n...\n</redacted_thinking>\n<answer>\n...\n</answer>"

# Use signature_comment as the "### code solution" block (see open_r1/grpo.py + GroupedSolGRPOTrainer)
use_signature: true


# GRPO trainer config
bf16: true
do_eval: false
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: true
hub_model_id: coderm-8b-full-exp7-signature
hub_strategy: every_save
push_to_hub: false
learning_rate: 5.0e-06

# num_iterations=2 enables GRPO clipping
num_iterations: 2
log_completions: true
log_level: info
logging_first_step: true
logging_steps: 1
logging_strategy: steps
lr_scheduler_type: cosine

max_steps: -1
num_train_epochs: 1
output_dir: data/coderm-8b-full-exp7-signature
overwrite_output_dir: true
per_device_eval_batch_size: 2
per_device_train_batch_size: 2
push_to_hub: false
report_to:
- swanlab

reward_funcs:
- format
- unittest_reward_aggregation
- unittest_coverage_reward
reward_weights:
- 1.0
- 1.0
- 1.0

save_strategy: "steps"
save_steps: 25
save_total_limit: 3
seed: 42
temperature: 0.7


#memory config
gradient_accumulation_steps: 32
max_prompt_length: 1024
max_completion_length: 3584
num_generations: 32
num_sampled_solutions: 4
num_completions_per_solution: 8

#===== vllm config =====
use_vllm: true
vllm_mode: server
vllm_server_host: localhost
vllm_server_port: 8002
vllm_server_timeout: 600.0

# No LoRA - full parameter training
use_peft: false

# Custom reward aggregation — prod-only (no sum smoothing terms)
# Removed: 0.1/M+ * sum(B[correct]) and 0.1/M- * sum(B[~correct])
# Keeps only strict prod-based signals: test must pass ALL correct / fail ANY incorrect
unittest_reward_aggregation: >
  float(np.mean(
    0.5 * np.prod(B[correct_mask], axis=0)
    + 0.5 * np.prod(B[correct_mask], axis=0) * (1.0 - np.prod(B[~correct_mask], axis=0))
  ))

# Coverage/diversity reward over incorrect solutions only
unittest_coverage_reward: >
  float(
    0.0 if M_minus < 2 else
    (
      2.0
      / (K * M_minus * (M_minus - 1))
      * sum(
          abs(B[~correct_mask][i, k] - B[~correct_mask][j, k])
          for i in range(M_minus)
          for j in range(i + 1, M_minus)
          for k in range(K)
        )
    )
  )
